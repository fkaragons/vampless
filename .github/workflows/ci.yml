name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: core · api · web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @vampless/core
      - run: npm test -w @vampless/core
      - run: npm run typecheck -w @vampless/api
      - run: npm test -w @vampless/api
      - run: npm run lint -w @vampless/web
      - run: npm run build -w @vampless/web

  program:
    name: solana program (host tests + cross-impl vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p vampless-registry
